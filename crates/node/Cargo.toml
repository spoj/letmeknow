[package]
name = "lmk-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lmk-core.workspace = true
lmk-membership.workspace = true
lmk-net.workspace = true
lmk-proto.workspace = true
lmk-transport.workspace = true
anyhow.workspace = true
ed25519-dalek.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
n0-future = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server"] }
rcgen = "0.14"
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["full"] }
