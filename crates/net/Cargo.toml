[package]
name = "lmk-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bao-tree = { version = "0.16.1", default-features = false }
blake3.workspace = true
bytes = "1"
chacha20poly1305.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
iroh-blobs.workspace = true
lmk-proto.workspace = true
lmk-transport.workspace = true
n0-future = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "io-util"] }
tracing = "0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
iroh-blobs = { workspace = true, features = ["fs-store"] }
# FsStore runs its own multi-threaded runtime but does not ask for it.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
ed25519-dalek.workspace = true
iroh-relay = { workspace = true, features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
