[package]
name = "lmk-membership"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lmk-proto.workspace = true
anyhow.workspace = true
async-trait = "0.1"
ed25519-dalek.workspace = true
hex.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
n0-future = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["sync"] }
tracing = "0.1"

# The browser has only the client of `letmeknow serve`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify.workspace = true
rand.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
iroh-relay = { workspace = true, features = ["server"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["full"] }
