[package]
name = "letmeknow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "letmeknow"
path = "src/lib.rs"

[[bin]]
name = "letmeknow"
path = "src/main.rs"

[dependencies]
lmk-core.workspace = true
lmk-membership.workspace = true
lmk-node.workspace = true
lmk-proto.workspace = true
lmk-serve.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
n0-future = "0.3"
gethostname = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls-pki-types = { version = "1", features = ["std"] }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "rt", "macros", "net", "io-util", "sync", "time", "signal"] }
dirs = "7"

[dev-dependencies]
rcgen = "0.14"
tempfile.workspace = true
