[package]
name = "letmeknow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "letmeknow"
path = "src/lib.rs"

[[bin]]
name = "letmeknow"
path = "src/main.rs"

[dependencies]
lmk-core.workspace = true
lmk-node.workspace = true
lmk-proto.workspace = true
lmk-serve.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
gethostname = "1"
rustls-pki-types = { version = "1", features = ["std"] }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
notify.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "rt", "macros", "net", "io-util", "sync", "time", "signal"] }
yrs.workspace = true
dirs = "7"
qrcode = { version = "0.14", default-features = false }
similar = "3"
