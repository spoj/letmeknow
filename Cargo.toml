[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.23.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lmk-proto = { path = "crates/proto" }
lmk-core = { path = "crates/core" }
lmk-membership = { path = "crates/membership" }
lmk-net = { path = "crates/net" }
lmk-node = { path = "crates/node" }
lmk-serve = { path = "crates/serve" }
lmk-testing = { path = "crates/testing" }
anyhow = "1"
base64 = "0.23"
chacha20poly1305 = "0.11"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "3.0"
hex = "0.4"
hkdf = "0.13"
iroh = { version = "=1.3.0", default-features = false }
iroh-relay = { version = "=1.3.0", default-features = false }
notify = "8.2"
openmls = { version = "=0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
rand = "0.9"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = "1.53"
tokio-rustls-acme = "0.9"

# Dependencies optimized in tests, which do real cryptography.
[profile.dev.package."*"]
opt-level = 2
