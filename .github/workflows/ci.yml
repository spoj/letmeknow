name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  # The release runs CI itself, next to its builds.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - if: runner.os == 'Linux'
        run: cargo build -p lmk-node -p lmk-core -p lmk-net -p lmk-membership -p lmk-client -p lmk-web --target wasm32-unknown-unknown
      # The client core builds for Android, with the runner's NDK.
      - if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android
          ndk=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang AR_aarch64_linux_android=$ndk/llvm-ar \
            cargo check -p lmk-client --target aarch64-linux-android
      - if: runner.os == 'Linux'
        run: cargo clippy -p lmk-web --target wasm32-unknown-unknown --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/version-pins.py check
      - if: runner.os == 'Linux'
        run: python -u test/release.py
      - if: runner.os == 'Linux'
        run: python -u test/compatibility_test.py
      - if: runner.os == 'Linux'
        name: Build the native compatibility candidate and ALPN fixture
        run: cargo build -p letmeknow -p lmk-kinds --bins --example compatibility_alpn
      - if: runner.os == 'Linux'
        name: Resolve authoritative published baselines
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python -u test/compatibility.py resolve --candidate-version "$version" --out "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: runner.os == 'Linux'
        name: Published old service writer (not covered by ordinary cargo test)
        run: python -u test/compatibility.py old-writer --baselines "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: runner.os == 'Linux'
        name: Exact native candidate against published baselines
        run: python -u test/compatibility.py run --bin "$PWD/target/debug/letmeknow" --alpn-probe "$PWD/target/debug/examples/compatibility_alpn" --baselines "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: published-compatibility-ci
          path: ${{ runner.temp }}/compatibility
      # The browser client is the same on every OS, so only Linux builds and tests it.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - if: runner.os == 'Linux'
        run: npm ci && npx playwright install --with-deps chromium-headless-shell
        working-directory: web
      - if: runner.os == 'Linux'
        run: python -u test/deploy.py
      - run: python -u test/e2e.py ${{ runner.os != 'Linux' && '--no-browser' || '' }}
        timeout-minutes: 15
      # After e2e.py, which builds web/pkg, the WebAssembly bindings the app imports.
      - if: runner.os == 'Linux'
        run: npm run check
        working-directory: web
