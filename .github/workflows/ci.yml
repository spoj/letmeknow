name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  # The release runs CI itself, next to its builds.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # The client core, and the binaries released for Termux, build for Android, with the runner's NDK.
      - if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android
          ndk=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang AR_aarch64_linux_android=$ndk/llvm-ar \
            cargo check -p lmk-client -p letmeknow -p lmk-kinds --target aarch64-linux-android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: python -u test/deploy.py
      - if: runner.os == 'Linux'
        run: python -u test/pins.py
      - run: python -u test/e2e.py
        timeout-minutes: 15
