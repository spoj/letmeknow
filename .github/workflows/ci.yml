name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  # The release runs CI itself, next to its builds.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: runner.os == 'Linux'
        run: cargo build -p lmk-node -p lmk-core -p lmk-net -p lmk-membership --target wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The browser client is the same on every OS, so only Linux builds and tests it.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - if: runner.os == 'Linux'
        run: npm ci && npx playwright install --with-deps chromium-headless-shell
        working-directory: web
      - run: python -u test/e2e.py ${{ runner.os != 'Linux' && '--no-browser' || '' }}
        timeout-minutes: 15
      # After e2e.py, which builds web/pkg, the WebAssembly bindings the app imports.
      - if: runner.os == 'Linux'
        run: npm run check
        working-directory: web
