name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # The in-process tests, many times on 2 cores, where races show.
  two-cores:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lmk-node -p lmk-client --no-run && cargo test -p letmeknow --lib --no-run
      - run: |
          failed=0
          for i in $(seq 30); do
            taskset -c 0,1 cargo test -p lmk-node -p lmk-client || failed=1
            taskset -c 0,1 cargo test -p letmeknow --lib || failed=1
          done
          exit $failed
