name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # Many more seeds of the simulation than CI runs on every push, new ones each night.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          from=$(( GITHUB_RUN_NUMBER * 10000 ))
          cargo run -p lmk-sim --release -- --seeds $from..$(( from + 10000 ))

  # The in-process tests, over the real iroh stack the simulator replaces, many times on 2 cores, where races show.
  two-cores:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lmk-node -p lmk-client --no-run && cargo test -p letmeknow --lib --no-run
      - run: |
          failed=0
          for i in $(seq 30); do
            taskset -c 0,1 cargo test -p lmk-node -p lmk-client || failed=1
            taskset -c 0,1 cargo test -p letmeknow --lib || failed=1
          done
          exit $failed
