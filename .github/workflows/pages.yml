name: pages
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Successful release workflow run ID (review cutover before approving)
        required: true
        type: string
      release_tag:
        description: Reviewed vX.Y.Z tag
        required: true
        type: string
      release_sha:
        description: Reviewed full source commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      config_artifact: ${{ steps.config.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Require tested, published release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 deploy/release-run.py "$GITHUB_REPOSITORY" "$RELEASE_RUN" "$RELEASE_TAG" "$RELEASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name frontend --dir artifact
          mkdir site
          tar -xzf artifact/frontend.tar.gz -C site
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name archive-x86_64-unknown-linux-musl --dir backend
          tar -xzf backend/letmeknow-*-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C backend
          cmp site/backend.json backend/backend.json
          python3 deploy/check-backend.py site/backend.json "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: config
        with:
          name: backend-config
          path: site/backend.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.config_artifact }}
          merge-multiple: true
          path: config
      - name: Recheck the backend after approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 deploy/release-run.py "$GITHUB_REPOSITORY" "$RELEASE_RUN" "$RELEASE_TAG" "$RELEASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 deploy/check-backend.py config/backend.json "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/deploy-pages@v4
        id: deployment
