name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Tests run next to the builds; only publishing waits for both.
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The plugins of the kinds letmeknow ships go beside it, where a session looks for them first, and git's remote
      # helper beside them, where it finds letmeknow.
      - run: cargo build --release --target ${{ matrix.target }} -p letmeknow -p letmeknow-kind-doc -p letmeknow-kind-git
      - name: Package
        run: |
          suffix=; [[ "${{ matrix.target }}" == *windows* ]] && suffix=.exe
          exes=()
          for exe in letmeknow letmeknow-kind-doc letmeknow-kind-git git-remote-lmk; do exes+=("target/${{ matrix.target }}/release/$exe$suffix"); done
          name=letmeknow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$name" "npm/${{ matrix.npm }}/bin"
          cp README.md SKILL.md LICENSE "${exes[@]}" "$name/"
          cp "${exes[@]}" "npm/${{ matrix.npm }}/bin/"
          if [[ -n "$suffix" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            letmeknow-*.tar.gz
            letmeknow-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: npm/${{ matrix.npm }}

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/archive-*/*
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted publishing: npm takes the workflow's OIDC token, so no npm token is kept.
      - name: npm
        run: |
          version=${GITHUB_REF_NAME#v}
          publish() { npm view "$1@$version" version >/dev/null 2>&1 || npm publish --access public --provenance; }
          for dir in dist/npm-*; do
            platform=${dir#dist/npm-}
            os=${platform%-*} cpu=${platform#*-}
            chmod +x "$dir"/bin/*
            cp LICENSE "$dir/"
            cat > "$dir/package.json" <<EOF
          {"name":"@letmeknow/$platform","version":"$version","description":"letmeknow binary for $platform","license":"MIT","repository":{"type":"git","url":"git+https://github.com/spoj/letmeknow.git"},"os":["$os"],"cpu":["$cpu"],"files":["bin"]}
          EOF
            (cd "$dir" && publish "@letmeknow/$platform")
            (cd npm/cli && npm pkg set "optionalDependencies.@letmeknow/$platform=$version")
          done
          for dir in dist/npm-*; do
            package=@letmeknow/${dir#dist/npm-}@$version
            # The registry can take several minutes to show a package; after fifteen, fail rather than hang.
            for _ in $(seq 90); do npm view "$package" version --prefer-online >/dev/null 2>&1 && break; sleep 10; done
            npm view "$package" version --prefer-online >/dev/null
          done
          cp README.md LICENSE npm/cli/
          cd npm/cli && npm pkg set version="$version" && publish @letmeknow/cli
