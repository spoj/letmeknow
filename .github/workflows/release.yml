name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: client
      - name: Package
        run: |
          name=letmeknow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp client/target/${{ matrix.target }}/release/letmeknow.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp client/target/${{ matrix.target }}/release/letmeknow "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: letmeknow-*.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes letmeknow-*
        env:
          GH_TOKEN: ${{ github.token }}
