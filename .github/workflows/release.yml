name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Tests run next to the builds; only publishing waits for both.
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The plugins of the kinds letmeknow ships go beside it, where a session looks for them first.
      - run: cargo build --release --target ${{ matrix.target }} -p letmeknow -p lmk-kinds
      - if: matrix.npm == 'linux-x64'
        name: Test the release backend artifact
        run: LMK_E2E_BIN="$PWD/target/${{ matrix.target }}/release/letmeknow" python3 -u test/e2e.py --no-browser
      - if: matrix.npm == 'linux-x64'
        name: Build the ALPN compatibility fixture
        run: cargo build --release --target ${{ matrix.target }} -p letmeknow --example compatibility_alpn
      - if: matrix.npm == 'linux-x64'
        name: Resolve published baselines for the exact release artifact
        run: python3 -u test/compatibility.py resolve --candidate-version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: matrix.npm == 'linux-x64'
        name: Published old service writer
        run: python3 -u test/compatibility.py old-writer --baselines "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: matrix.npm == 'linux-x64'
        name: Exact release executable against published baselines
        run: python3 -u test/compatibility.py run --bin "$PWD/target/${{ matrix.target }}/release/letmeknow" --alpn-probe "$PWD/target/${{ matrix.target }}/release/examples/compatibility_alpn" --baselines "$RUNNER_TEMP/compatibility/baselines.json"
        timeout-minutes: 20
      - if: always() && matrix.npm == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: published-compatibility-release
          path: ${{ runner.temp }}/compatibility
      - name: Package
        run: |
          suffix=; [[ "${{ matrix.target }}" == *windows* ]] && suffix=.exe
          exes=()
          for exe in letmeknow letmeknow-kind-doc letmeknow-kind-table; do exes+=("target/${{ matrix.target }}/release/$exe$suffix"); done
          name=letmeknow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$name" "npm/${{ matrix.npm }}/bin"
          cp README.md SKILL.md LICENSE deploy/letmeknow.service "${exes[@]}" "$name/"
          cp "${exes[@]}" "npm/${{ matrix.npm }}/bin/"
          if [[ -n "$suffix" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            letmeknow-*.tar.gz
            letmeknow-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: npm/${{ matrix.npm }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium-headless-shell
        working-directory: web
      # backend.json must contain the reviewed fresh public key. No environment override in releases.
      - run: npm run build && npm run check && node artifact-test.mjs dist --negative-controls
        working-directory: web
      - run: tar -C web/dist -czf frontend.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz

  publish:
    needs: [ci, build, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          for file in dist/archive-*/* dist/frontend/frontend.tar.gz; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/archive-*/* dist/frontend/frontend.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted publishing: npm takes the workflow's OIDC token, so no npm token is kept.
      - name: npm
        run: |
          version=${GITHUB_REF_NAME#v}
          # npm scans a package before it shows it, and answers 409 to a publish of a version it still holds.
          publish() {
            npm view "$1@$version" version >/dev/null 2>&1 && return
            npm publish --access public --provenance 2>"$RUNNER_TEMP/publish.log" && return
            cat "$RUNNER_TEMP/publish.log" >&2
            grep -q "previously staged version" "$RUNNER_TEMP/publish.log"
          }
          for dir in dist/npm-*; do
            platform=${dir#dist/npm-}
            os=${platform%-*} cpu=${platform#*-}
            # Termux's node says android; the static Linux binaries run there.
            oses="\"$os\""; [ "$os" = linux ] && oses='"linux","android"'
            chmod +x "$dir"/bin/*
            cp LICENSE "$dir/"
            cat > "$dir/package.json" <<EOF
          {"name":"@letmeknow/$platform","version":"$version","description":"letmeknow binary for $platform","license":"MIT","repository":{"type":"git","url":"git+https://github.com/spoj/letmeknow.git"},"os":[$oses],"cpu":["$cpu"],"files":["bin"]}
          EOF
            (cd "$dir" && publish "@letmeknow/$platform")
            (cd npm/cli && npm pkg set "optionalDependencies.@letmeknow/$platform=$version")
          done
          for dir in dist/npm-*; do
            package=@letmeknow/${dir#dist/npm-}@$version
            # A package held for review blocks rollout rather than leaving that platform behind.
            for _ in $(seq 90); do npm view "$package" version --prefer-online >/dev/null 2>&1 && break; sleep 10; done
            npm view "$package" version --prefer-online
          done
          cp README.md LICENSE npm/cli/
          cd npm/cli && npm pkg set version="$version" && publish @letmeknow/cli
          for _ in $(seq 90); do npm view "@letmeknow/cli@$version" version --prefer-online >/dev/null 2>&1 && break; sleep 10; done
          npm view "@letmeknow/cli@$version" version --prefer-online
