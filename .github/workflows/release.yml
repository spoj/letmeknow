name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  # Tests run next to the builds; only publishing waits for both.
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, npm: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, npm: linux-arm64 }
          # Termux may run programs only through Android's linker, which takes no static binary.
          - { os: ubuntu-latest, target: aarch64-linux-android, npm: android-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: contains(matrix.target, 'android')
        run: |
          ndk=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ndk/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/llvm-ar" >> "$GITHUB_ENV"
      # The plugins of the kinds letmeknow ships go beside it, where a session looks for them first.
      - run: cargo build --release --target ${{ matrix.target }} -p letmeknow -p lmk-kinds
      - if: matrix.npm == 'linux-x64'
        name: Test the release backend artifact
        run: LMK_E2E_BIN="$PWD/target/${{ matrix.target }}/release/letmeknow" python3 -u test/e2e.py
      - name: Package
        run: |
          suffix=; [[ "${{ matrix.target }}" == *windows* ]] && suffix=.exe
          exes=()
          for exe in letmeknow letmeknow-kind-doc letmeknow-kind-table; do exes+=("target/${{ matrix.target }}/release/$exe$suffix"); done
          name=letmeknow-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "$name" "npm/${{ matrix.npm }}/bin"
          cp README.md SKILL.md LICENSE deploy/letmeknow.service deploy/backend.json "${exes[@]}" "$name/"
          cp "${exes[@]}" "npm/${{ matrix.npm }}/bin/"
          if [[ -n "$suffix" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            letmeknow-*.tar.gz
            letmeknow-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm }}
          path: npm/${{ matrix.npm }}

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          for file in dist/archive-*/*; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/archive-*/* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted publishing: npm takes the workflow's OIDC token, so no npm token is kept.
      - name: npm
        run: |
          version=${GITHUB_REF_NAME#v}
          # npm scans a package before it shows it, and answers 409 to a publish of a version it still holds.
          publish() {
            npm view "$1@$version" version >/dev/null 2>&1 && return
            npm publish --access public --provenance 2>"$RUNNER_TEMP/publish.log" && return
            cat "$RUNNER_TEMP/publish.log" >&2
            grep -q "previously staged version" "$RUNNER_TEMP/publish.log"
          }
          for dir in dist/npm-*; do
            platform=${dir#dist/npm-}
            # Trusted publishing cannot make a package: a platform new to npm waits for its first version, published by hand.
            if npm view "@letmeknow/$platform" name 2>&1 | grep -q E404; then
              echo "::warning::@letmeknow/$platform is not on npm: publish its first version by hand and trust this workflow, then release again"
              rm -r "$dir"
              continue
            fi
            os=${platform%-*} cpu=${platform#*-}
            chmod +x "$dir"/bin/*
            cp LICENSE "$dir/"
            cat > "$dir/package.json" <<EOF
          {"name":"@letmeknow/$platform","version":"$version","description":"letmeknow binary for $platform","license":"MIT","repository":{"type":"git","url":"git+https://github.com/spoj/letmeknow.git"},"os":["$os"],"cpu":["$cpu"],"files":["bin"]}
          EOF
            (cd "$dir" && publish "@letmeknow/$platform")
            (cd npm/cli && npm pkg set "optionalDependencies.@letmeknow/$platform=$version")
          done
          for dir in dist/npm-*; do
            package=@letmeknow/${dir#dist/npm-}@$version
            # A package held for review blocks rollout rather than leaving that platform behind.
            for _ in $(seq 90); do npm view "$package" version --prefer-online >/dev/null 2>&1 && break; sleep 10; done
            npm view "$package" version --prefer-online
          done
          cp README.md LICENSE npm/cli/
          cd npm/cli && npm pkg set version="$version" && publish @letmeknow/cli
          for _ in $(seq 90); do npm view "@letmeknow/cli@$version" version --prefer-online >/dev/null 2>&1 && break; sleep 10; done
          npm view "@letmeknow/cli@$version" version --prefer-online
