[package]
name = "letmeknow"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_sqlite_storage = "0.3"
openmls_traits = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rusqlite = "0.37"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
